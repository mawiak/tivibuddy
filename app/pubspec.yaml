name: tivibuddy
description: Open source IPTV player for TV, mobile, desktop and web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  riverpod_annotation: ^4.0.8

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: true
  generate: true
