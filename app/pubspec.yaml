name: tivibuddy
description: Open source IPTV player for TV, mobile, desktop and web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7

resolution: workspace

dependencies:
  crypto: ^3.0.8
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  riverpod_annotation: ^4.0.8
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: true
  generate: true
